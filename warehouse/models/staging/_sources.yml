version: 2

# raw 层：pandas ETL（quantai/warehouse/etl.py）装载的原始数据。
# 在源头就挂 not_null 测试——脏数据在进 staging 前被拦下。
sources:
  - name: raw
    schema: raw
    tables:
      - name: prices
        columns:
          - name: symbol
            tests: [not_null]
          - name: date
            tests: [not_null]
          # close 不在 raw 层断言 not_null：raw 原样保留源数据（yfinance 偶发
          # NaN 行是常态），清洗职责在 staging 的 where 过滤——在源头断言会让
          # 一行脏数据 fail 整个 build，staging 的清洗永远轮不到执行。
      - name: trading_days
        columns:
          - name: date
            tests: [not_null, unique]
      - name: positions
        columns:
          - name: as_of
            tests: [not_null]
          - name: symbol
            tests: [not_null]
          - name: shares
            tests: [not_null]
      - name: portfolio_cash
        columns:
          - name: as_of
            tests: [not_null, unique]
      - name: trades
        columns:
          - name: run_id
            tests: [not_null]
          - name: action
            tests:
              - accepted_values:
                  values: ["BUY", "SELL"]
      - name: signals
        columns:
          - name: symbol
            tests: [not_null]
          - name: date
            tests: [not_null]
      - name: backtest_runs
        columns:
          - name: run_id
            tests: [not_null, unique]
      - name: backtest_equity
        columns:
          - name: run_id
            tests: [not_null]
          - name: equity
            tests: [not_null]
      - name: news
        columns:
          - name: title
            tests: [not_null]
          - name: link
            tests: [not_null, unique]
      - name: news_scores
        columns:
          - name: link
            tests: [not_null, unique]
          - name: sentiment
            tests: [not_null]
