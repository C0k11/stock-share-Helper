# dbt connection profile (local DuckDB file; no secrets - safe to commit).
# Override the db file path with env var QUANTAI_DB_PATH (tests/CI point it
# at a temp file). Relative paths resolve against --project-dir (this folder).
# Keep ASCII-only (see dbt_project.yml note).
quantai:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('QUANTAI_DB_PATH', '../data/warehouse/quantai.duckdb') }}"
      threads: 8
